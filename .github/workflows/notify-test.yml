name: notify-test
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: groupToken (group_api)
        uses: ./
        with:
          groupToken: ${{ secrets.WORLD_GROUP_TOKEN }}
          content: |
            world-notify-action リリース（groupToken）
